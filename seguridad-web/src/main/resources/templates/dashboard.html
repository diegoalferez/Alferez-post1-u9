<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <h1>Dashboard</h1>

    <p>Bienvenido, <span th:text="${nombre}"></span></p>

    <!--
    <p>Con utext: <span th:utext="${nombre}"></span></p>
    -->

    <p>Correo: <span th:text="${email}"></span></p>
    <p>Roles: <span th:text="${roles}"></span></p>

    <nav>
        <a th:href="@{/tareas}">Mis tareas</a>
        <!-- Solo visible para ADMIN -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Panel de Administración</a>
    </nav>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar Sesión</button>
    </form>
</main>
</body>
</html>
