<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <h1>Registro de Usuario</h1>
    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <label>Nombre:
            <input type="text" th:field="*{nombre}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

        <label>Correo:
            <input type="email" th:field="*{email}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label>Contraseña:
            <input type="password" th:field="*{contrasenia}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('contrasenia')}" th:errors="*{contrasenia}"></div>

        <button type="submit">Registrarse</button>
    </form>
    <p><a th:href="@{/login}">¿Ya tiene cuenta? Iniciar sesión</a></p>
</main>
</body>
</html>
