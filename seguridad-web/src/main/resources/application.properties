spring.application.name=seguridad-web

# MySQL (docker-compose.yml, puerto 3308)
spring.datasource.url=jdbc:mysql://localhost:3308/seguridad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=appuser
spring.datasource.password=${DB_PASSWORD:apppass123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (Parte 2). En producción la clave va en la variable de entorno JWT_SECRET
# (mínimo 32 caracteres); el valor por defecto es solo para el laboratorio.
jwt.secret=${JWT_SECRET:clave-secreta-laboratorio-u9-minimo-32-caracteres-xyz}
jwt.expiration-ms=3600000
